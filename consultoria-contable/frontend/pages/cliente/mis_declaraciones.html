<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Declaraciones - Consultancy</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/cliente/declaraciones.css">
    <link rel="stylesheet" href="../../css/shared/notifications.css">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">


</head>
<body>

    <div class="container-declaraciones">
        <div class="acciones-declaraciones">
            <ul class="tabs-principales">
                <li class="tab-item active" id="tab-mensuales">Mensuales</li>
                <li class="tab-item" id="tab-anual">Anual</li>
                <li class="tab-item" id="tab-historial">Historial</li>
            </ul>
        </div>

        <section class="seccion-declaracion active card-blanca" id="seccion-mensuales">
            <div class="declaraciones-toolbar">
                <h4>Declaraciones Mensuales <i class='bx bx-chevron-down'></i></h4>
            </div>
            <div class="table-container">
                <table class="tabla-consultancy">
                    <thead>
                        <tr>
                            <th>Periodo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Enero 2024</td>
                            <td><span class="status pendiente">Pendiente</span></td>
                            <td><button class="btn-tabla primary">Subir Documentos</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- JS -->
    <script src="../../js/utils/sessionCheck.js"></script>
    <script src="../../js/views/declaracionesView.js"></script>

    <script>
        const tabs = document.querySelectorAll('.tab-item');
        const secciones = document.querySelectorAll('.seccion-declaracion');
        const mapa = {
            'tab-mensuales': 'seccion-mensuales',
            'tab-anual':     'seccion-anual',
            'tab-historial': 'seccion-historial'
        };

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                secciones.forEach(s => s.classList.remove('active'));
                tab.classList.add('active');
                const target = document.getElementById(mapa[tab.id]);
                if (target) target.classList.add('active');
            });
        });
    </script>
    <script src="../../js/helpers/logoutHelper.js"></script>
    <script>
        window.SIDEBAR_CONFIG = {
            role: 'cliente',
            userName: 'Cliente',
            userRole: 'Cliente',
            currentPage: 'declaraciones'
    <script src="../../js/notifications.js"></script>
        };
    </script>
    <script src="../../js/sidebar.js"></script>
</body>
</html>
