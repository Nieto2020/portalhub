<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Declaraciones - Consultancy</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/mis_declaraciones.css">

    <!-- Boxicons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="../../css/img/logo.png" alt="Consultancy">
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="dashboard.html">Inicio</a></li>
                <li><a href="mis_declaraciones.html" class="active">Mis Declaraciones</a></li>
                <li><a href="documentos.html">Documentos</a></li>
                <li><a href="pagos.html">Pagos</a></li>
                <li><a href="">Tareas</a></li>
                <li><a href="">Reportes</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="">Ayuda</a></li>
            </ul>
        </nav>
    </header>

    <div class="container-declaraciones">
        <div class="acciones-declaraciones">
            <ul class="tabs-principales">
                <li class="tab-item active" id="tab-mensuales">Mensuales</li>
                <li class="tab-item" id="tab-anual">Anual</li>
                <li class="tab-item" id="tab-historial">Historial</li>
            </ul>
        </div>

        <section class="seccion-declaracion active card-blanca" id="seccion-mensuales">
            <div class="declaraciones-toolbar">
                <h4>Declaraciones Mensuales <i class='bx bx-chevron-down'></i></h4>
            </div>
            <div class="table-container">
                <table class="tabla-consultancy">
                    <thead>
                        <tr>
                            <th>Periodo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Enero 2024</td>
                            <td><span class="status pendiente">Pendiente</span></td>
                            <td><button class="btn-tabla primary">Subir Documentos</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- JS -->
    <script src="../../js/utils/sessionCheck.js"></script>
    <script src="../../js/views/declaracionesView.js"></script>

    <script>
        const tabs = document.querySelectorAll('.tab-item');
        const secciones = document.querySelectorAll('.seccion-declaracion');
        const mapa = {
            'tab-mensuales': 'seccion-mensuales',
            'tab-anual':     'seccion-anual',
            'tab-historial': 'seccion-historial'
        };

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                secciones.forEach(s => s.classList.remove('active'));
                tab.classList.add('active');
                const target = document.getElementById(mapa[tab.id]);
                if (target) target.classList.add('active');
            });
        });
    </script>
</body>
</html>
