<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Asesor</title>
    <link rel="stylesheet" href="../../css/shared/variables.css">
    <link rel="stylesheet" href="../../css/shared/base.css">
    <link rel="stylesheet" href="../../css/shared/buttons.css">
    <link rel="stylesheet" href="../../css/shared/forms.css">
    <link rel="stylesheet" href="../../css/shared/tables.css">
    <link rel="stylesheet" href="../../css/shared/cards.css">
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/asesor/reportes.css">
    <link rel="stylesheet" href="../../css/shared/notifications.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

    <main class="dashboard-content">

        <div class="page-header">
            <div>
                <h1><i class="bx bx-bar-chart-alt-2"></i> Mis Reportes</h1>
                <p>Crea y comparte reportes para el equipo administrativo.</p>
            </div>
            <div class="header-actions">
            </div>
        </div>

        <div class="main-grid">

            <!-- Crear Reporte -->
            <div class="card" id="formCard">
                <h2><i class="bx bx-plus-circle" style="color:#6366f1;"></i> Nuevo Reporte</h2>
                <form id="reportForm">
                    <div class="form-group">
                        <label for="reportTitulo">Título del Reporte *</label>
                        <input type="text" id="reportTitulo" placeholder="Ej: Avance fiscal Q2" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="reportTipo">Tipo *</label>
                            <select id="reportTipo" required>
                                <option value="Mensual">Mensual</option>
                                <option value="Trimestral">Trimestral</option>
                                <option value="Anual">Anual</option>
                                <option value="Especial">Especial</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="reportEstado">Estado</label>
                            <select id="reportEstado">
                                <option value="Borrador">Borrador</option>
                                <option value="Publicado">Publicado</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reportDescripcion">Descripción *</label>
                        <textarea id="reportDescripcion" placeholder="Resumen del reporte..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="reportContenido">Contenido Detallado</label>
                        <textarea id="reportContenido" rows="5" placeholder="Análisis detallado, cifras, observaciones..."></textarea>
                    </div>
                    <div id="formFeedback"></div>
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="bx bx-send"></i> Enviar Reporte
                    </button>
                </form>
            </div>

            <!-- Historial -->
            <div class="card">
                <h2><i class="bx bx-history" style="color:#10b981;"></i> Historial</h2>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Tipo</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr>
                                <td colspan="4">
                                    <div class="empty-state">
                                        <i class="bx bx-loader bx-spin"></i>
                                        <p>Cargando mis reportes...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Toast -->
    <div id="toast"></div>

    <script src="../../js/helpers/logoutHelper.js"></script>
    <script>
        window.SIDEBAR_CONFIG = {
            role: 'asesor', userName: 'Asesor', userRole: 'Asesor', currentPage: 'reportes'
        };
    </script>
    <script src="../../js/sidebar.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
        const toast = document.getElementById('toast');
        const showToast = (msg, ok) => {
            toast.textContent = msg;
            toast.className = ok ? 'success' : 'error';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        };

        async function loadMyReports() {
            const tbody = document.getElementById('historyTableBody');
            try {
                const res = await fetch('../../../backend/modules/reportes/listar.php');
                const json = await res.json();
                const reports = json.data || [];

                if (reports.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><i class="bx bx-file-blank"></i><p>Aún no has creado reportes</p></div></td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                reports.forEach(r => {
                    const tipoClass  = r.tipo.toLowerCase();
                    const estadoClass = r.estado.toLowerCase();
                    const fecha = r.fecha_creacion
                        ? new Date(r.fecha_creacion).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' })
                        : '---';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${r.titulo}</strong></td>
                        <td><span class="badge ${tipoClass}">${r.tipo}</span></td>
                        <td><span class="badge ${estadoClass}">${r.estado}</span></td>
                        <td>${fecha}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><i class="bx bx-error-circle"></i><p>Error al cargar</p></div></td></tr>';
            }
        }

        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const feedback = document.getElementById('formFeedback');
            const btn = document.getElementById('submitBtn');

            feedback.textContent = '';
            feedback.style.color = '';

            const data = {
                titulo:      document.getElementById('reportTitulo').value.trim(),
                descripcion: document.getElementById('reportDescripcion').value.trim(),
                contenido:   document.getElementById('reportContenido').value.trim(),
                tipo:        document.getElementById('reportTipo').value,
                estado:      document.getElementById('reportEstado').value
            };

            if (!data.titulo || !data.descripcion) {
                feedback.textContent = '⚠️ Título y descripción son obligatorios.';
                feedback.style.color = '#991b1b';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="bx bx-loader bx-spin"></i> Enviando...';

            try {
                const res = await fetch('../../../backend/modules/reportes/crear.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const json = await res.json();

                if (res.ok) {
                    showToast('✅ Reporte creado exitosamente', true);
                    this.reset();
                    loadMyReports();
                } else {
                    showToast('❌ ' + (json.message || 'Error'), false);
                }
            } catch (err) {
                showToast('❌ Error de conexión', false);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bx bx-send"></i> Enviar Reporte';
            }
        });

        loadMyReports();
    </script>
</body>
</html>
