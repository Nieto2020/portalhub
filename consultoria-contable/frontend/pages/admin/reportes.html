<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Admin</title>
    <link rel="stylesheet" href="../../css/shared/variables.css">
    <link rel="stylesheet" href="../../css/shared/base.css">
    <link rel="stylesheet" href="../../css/shared/buttons.css">
    <link rel="stylesheet" href="../../css/shared/forms.css">
    <link rel="stylesheet" href="../../css/shared/tables.css">
    <link rel="stylesheet" href="../../css/shared/cards.css">
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/admin/reportes.css">
    <link rel="stylesheet" href="../../css/shared/notifications.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

    <main class="dashboard-content">

        <div class="page-header">
            <div>
                <h1><i class="bx bx-file"></i> Reportes del Sistema</h1>
                <p>Visualiza todos los reportes generados por los asesores.</p>
            </div>
            <div class="header-actions">
            </div>
        </div>

        <!-- Mini stats -->
        <div class="mini-stats" id="miniStats">
            <div class="mini-stat">
                <div class="ms-icon indigo"><i class="bx bx-file"></i></div>
                <div><div class="ms-value" id="statTotal">--</div><div class="ms-label">Reportes Totales</div></div>
            </div>
            <div class="mini-stat">
                <div class="ms-icon emerald"><i class="bx bx-check-circle"></i></div>
                <div><div class="ms-value" id="statPublicados">--</div><div class="ms-label">Publicados</div></div>
            </div>
            <div class="mini-stat">
                <div class="ms-icon amber"><i class="bx bx-user-voice"></i></div>
                <div><div class="ms-value" id="statAsesores">--</div><div class="ms-label">Asesores Activos</div></div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filters-bar" id="filtersBar">
            <div class="filter-group">
                <label for="filterSearch">Buscar</label>
                <input type="text" id="filterSearch" placeholder="Título o asesor..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <label for="filterTipo">Tipo</label>
                <select id="filterTipo" onchange="applyFilters()">
                    <option value="todos">Todos</option>
                    <option value="Mensual">Mensual</option>
                    <option value="Trimestral">Trimestral</option>
                    <option value="Anual">Anual</option>
                    <option value="Especial">Especial</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterEstado">Estado</label>
                <select id="filterEstado" onchange="applyFilters()">
                    <option value="todos">Todos</option>
                    <option value="Publicado">Publicado</option>
                    <option value="Borrador">Borrador</option>
                </select>
            </div>
        </div>

        <!-- Tabla de reportes -->
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Asesor</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="bx bx-loader bx-spin"></i>
                                <p>Cargando reportes...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Calificaciones de Asesores -->
        <h2 style="margin: 32px 0 16px;display:flex;align-items:center;gap:8px;">
            <i class="bx bx-star" style="color:var(--warning);"></i> Calificaciones de Asesores
        </h2>
        <div class="card" style="overflow:hidden;padding:0;">
            <table>
                <thead>
                    <tr>
                        <th>Asesor</th>
                        <th>Promedio</th>
                        <th>Total Calificaciones</th>
                        <th>Última</th>
                    </tr>
                </thead>
                <tbody id="ratingsTableBody">
                    <tr>
                        <td colspan="4">
                            <div class="empty-state"><i class="bx bx-loader bx-spin"></i><p>Cargando...</p></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <!-- Modal de detalle -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle"></h2>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-content" id="modalBody"></div>
        </div>
    </div>

    <script src="../../js/helpers/logoutHelper.js"></script>
    <script>
        window.SIDEBAR_CONFIG = {
            role: 'admin', userName: 'Administrador', userRole: 'Administrador', currentPage: 'reportes'
        };
    </script>
    <script src="../../js/sidebar.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
        // ═══════════════════════════════════════════════════════
        // ▼▼▼ MOCKUP — Eliminar todo este bloque en producción ▼▼▼
        // ═══════════════════════════════════════════════════════
        const MOCK = true;
        const MOCK_REPORTS = [
            { id_reporte:1, titulo:'Declaración Mensual Mayo', id_asesor:6, nombre_asesor:'Laura García', tipo:'Mensual', estado:'Publicado', fecha_creacion:'2026-06-05 14:00:00', contenido:'Análisis detallado del IVA y retenciones correspondientes al mes de mayo 2026.\n\nEl cliente presenta un saldo a favor de $3,200 MXN.\n\nRecomendaciones:\n- Ajustar facturación electrónica\n- Revisar deducciones personales' },
            { id_reporte:2, titulo:'Revisión Trimestral Q2', id_asesor:6, nombre_asesor:'Laura García', tipo:'Trimestral', estado:'Publicado', fecha_creacion:'2026-06-15 10:00:00', contenido:'Balance trimestral Q2 2026. Ingresos acumulados: $450,000. Egresos: $320,000. Utilidad: $130,000.' },
            { id_reporte:3, titulo:'Auditoría Interna Cliente A', id_asesor:7, nombre_asesor:'David López', tipo:'Especial', estado:'Borrador', fecha_creacion:'2026-06-20 16:30:00', contenido:'Borrador de auditoría interna. Pendiente revisión de documentos soporte.' },
            { id_reporte:4, titulo:'Declaración Anual 2025', id_asesor:7, nombre_asesor:'David López', tipo:'Anual', estado:'Publicado', fecha_creacion:'2026-04-10 09:00:00', contenido:'Declaración anual ejercicio fiscal 2025.\n\nTotal ingresos: $1,200,000\nDeducciones autorizadas: $380,000\nISR a pagar: $95,400' },
            { id_reporte:5, titulo:'Declaración Mensual Junio', id_asesor:6, nombre_asesor:'Laura García', tipo:'Mensual', estado:'Borrador', fecha_creacion:'2026-07-01 11:00:00', contenido:'Pendiente de cierre contable del mes de junio.' },
            { id_reporte:6, titulo:'Nóminas Junio', id_asesor:7, nombre_asesor:'David López', tipo:'Mensual', estado:'Publicado', fecha_creacion:'2026-07-02 08:30:00', contenido:'Cálculo de nóminas junio 2026. 15 empleados registrados.' },
        ];
        const MOCK_RATINGS_REPORTES = [
            { nombre:'Laura García', correo:'laura@asesor.com', promedio:4.8, total_calificaciones:15, ultima_calificacion:'2026-06-20' },
            { nombre:'David López', correo:'david@asesor.com', promedio:4.2, total_calificaciones:8, ultima_calificacion:'2026-06-15' },
        ];
        // ▲▲▲ END MOCKUP
        // ═══════════════════════════════════════════════════════

        let allReports = [];

        const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val ?? '--'; };

        async function loadReports() {
            try {
                // ▼ MOCKUP BRANCH — eliminar en producción, conservar solo el else
                if (MOCK) {
                    allReports = MOCK_REPORTS;
                } else {
                // ▲ END MOCKUP BRANCH
                    const res = await fetch('../../../backend/modules/reportes/listar.php');
                    const json = await res.json();
                    if (!res.ok) throw new Error(json.message);
                    allReports = json.data || [];
                // ▼ MOCKUP CLOSING BRACE — eliminar en producción
                }
                // ▲ END MOCKUP CLOSING
                applyFilters();
                updateStats();
            } catch (e) {
                console.warn(e);
                allReports = [];
                document.getElementById('reportTableBody').innerHTML =
                    '<tr><td colspan="6"><div class="empty-state"><i class="bx bx-error-circle"></i><p>Error al conectar con el servidor</p></div></td></tr>';
            }
        }

        function updateStats() {
            setText('statTotal', allReports.length);
            setText('statPublicados', allReports.filter(r => r.estado === 'Publicado').length);
            const asesoresUnicos = new Set(allReports.map(r => r.id_asesor));
            setText('statAsesores', asesoresUnicos.size);
        }

        function applyFilters() {
            const search  = (document.getElementById('filterSearch')?.value || '').toLowerCase();
            const tipo    = document.getElementById('filterTipo')?.value || 'todos';
            const estado  = document.getElementById('filterEstado')?.value || 'todos';

            const filtered = allReports.filter(r => {
                const mSearch = !search ||
                    r.titulo.toLowerCase().includes(search) ||
                    (r.nombre_asesor || r.correo_asesor || '').toLowerCase().includes(search);
                const mTipo   = tipo === 'todos' || r.tipo === tipo;
                const mEstado = estado === 'todos' || r.estado === estado;
                return mSearch && mTipo && mEstado;
            });

            renderTable(filtered);
        }

        function renderTable(reports) {
            const tbody = document.getElementById('reportTableBody');
            if (reports.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="bx bx-file-blank"></i><p>No se encontraron reportes</p></div></td></tr>';
                return;
            }

            tbody.innerHTML = '';
            reports.forEach(r => {
                const tipoClass = r.tipo.toLowerCase();
                const estadoClass = r.estado.toLowerCase();
                const fecha = r.fecha_creacion
                    ? new Date(r.fecha_creacion).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' })
                    : '---';
                const asesor = r.nombre_asesor || r.correo_asesor || '---';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="report-title" onclick="viewReport(${r.id_reporte})">${r.titulo}</span></td>
                    <td>${asesor}</td>
                    <td><span class="badge ${tipoClass}">${r.tipo}</span></td>
                    <td><span class="badge ${estadoClass}">${r.estado}</span></td>
                    <td>${fecha}</td>
                    <td><button class="btn-sm btn-view" onclick="viewReport(${r.id_reporte})"><i class="bx bx-show"></i> Ver</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function viewReport(id) {
            try {
                // ▼ MOCKUP BRANCH — eliminar en producción, conservar solo el else
                if (MOCK) {
                    const r = MOCK_REPORTS.find(rep => rep.id_reporte === id);
                    if (!r) { alert('Reporte no encontrado'); return; }
                    document.getElementById('modalTitle').textContent = r.titulo;
                    document.getElementById('modalMeta').innerHTML = `
                        <span><strong>Asesor:</strong> ${r.nombre_asesor || r.correo_asesor}</span>
                        <span><strong>Tipo:</strong> ${r.tipo}</span>
                        <span><strong>Estado:</strong> ${r.estado}</span>
                        <span><strong>Fecha:</strong> ${new Date(r.fecha_creacion).toLocaleString('es-MX')}</span>
                    `;
                    document.getElementById('modalBody').textContent = r.contenido || 'Sin contenido adicional.';
                    document.getElementById('modalOverlay').classList.add('active');
                    return;
                }
                // ▲ END MOCKUP BRANCH
                const res = await fetch(`../../../backend/modules/reportes/detalle.php?id=${id}`);
                const json = await res.json();
                if (!res.ok) throw new Error(json.message);
                const r = json.data;

                document.getElementById('modalTitle').textContent = r.titulo;
                document.getElementById('modalMeta').innerHTML = `
                    <span><strong>Asesor:</strong> ${r.nombre_asesor || r.correo_asesor}</span>
                    <span><strong>Tipo:</strong> ${r.tipo}</span>
                    <span><strong>Estado:</strong> ${r.estado}</span>
                    <span><strong>Fecha:</strong> ${new Date(r.fecha_creacion).toLocaleString('es-MX')}</span>
                `;
                document.getElementById('modalBody').textContent = r.contenido || r.descripcion || 'Sin contenido adicional.';
                document.getElementById('modalOverlay').classList.add('active');
            } catch (e) {
                alert('Error al cargar el reporte');
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        loadReports();
        loadRatings();

        // ── Calificaciones ──
        async function loadRatings() {
            const tbody = document.getElementById('ratingsTableBody');
            try {
                let data;
                // ▼ MOCKUP BRANCH — eliminar en producción, conservar solo el else
                if (MOCK) {
                    data = MOCK_RATINGS_REPORTES;
                } else {
                // ▲ END MOCKUP BRANCH
                    const res = await fetch('../../../backend/modules/calificaciones/estadisticas.php');
                    const json = await res.json();
                    if (!res.ok) throw new Error(json.message);
                    data = json.data || [];
                // ▼ MOCKUP CLOSING BRACE — eliminar en producción
                }
                // ▲ END MOCKUP CLOSING
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><i class="bx bx-star"></i><p>Sin calificaciones aún</p></div></td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(r => {
                    const stars = renderStars(r.promedio);
                    const fecha = r.ultima_calificacion
                        ? new Date(r.ultima_calificacion).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' })
                        : '---';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${escapeHtml(r.nombre)}</strong></td>
                        <td>${stars} <span style="font-weight:600;">${r.promedio}</span></td>
                        <td>${r.total_calificaciones}</td>
                        <td>${fecha}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><i class="bx bx-error-circle"></i><p>Error al cargar</p></div></td></tr>';
            }
        }

        function renderStars(rating) {
            let html = '';
            for (let i = 1; i <= 5; i++) {
                const filled = rating >= i;
                const half = !filled && rating >= i - 0.5;
                html += `<i class="bx ${filled ? 'bxs-star' : half ? 'bxs-star-half' : 'bx-star'}" style="color:#f59e0b;font-size:1rem;"></i>`;
            }
            return html;
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }
    </script>
</body>
</html>
