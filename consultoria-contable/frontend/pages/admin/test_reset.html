<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Admin</title>
</head>
<body>
    <h2>Resetear Contraseña de Usuario</h2>
    <div id="msg" style="padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; display: none;"></div>
    
    <label>ID del Usuario:</label>
    <input type="number" id="userId" placeholder="Ej: 5">
    <button onclick="resetPassword()">Generar Contraseña Temporal</button>

    <div id="result" style="margin-top: 20px; font-weight: bold; color: blue;"></div>

    <script>
        async function resetPassword() {
            const id_usuario = document.getElementById('userId').value;
            const resDiv = document.getElementById('result');
            const msgDiv = document.getElementById('msg');
            
            if(!id_usuario) return alert("Ingresa un ID");

            try {
                const response = await fetch('../../../backend/modules/usuarios/reset_password_admin.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_usuario })
                });

                const data = await response.json();

                if (response.ok) {
                    resDiv.innerHTML = `NUEVA CONTRASEÑA TEMPORAL: <span style="color:red; font-size:1.2em;">${data.data.temporary_password}</span><br>
                                      <small>Cópiala y dásela al usuario. Se le obligará a cambiarla al entrar.</small>`;
                    msgDiv.style.display = "none";
                } else {
                    msgDiv.textContent = data.message;
                    msgDiv.style.display = "block";
                    resDiv.textContent = "";
                }
            } catch (error) {
                alert("Error de conexión");
            }
        }
    </script>
</body>
</html>
