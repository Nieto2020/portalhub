<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Admin</title>
    <link rel="stylesheet" href="../../css/shared/variables.css">
    <link rel="stylesheet" href="../../css/shared/base.css">
    <link rel="stylesheet" href="../../css/shared/buttons.css">
    <link rel="stylesheet" href="../../css/shared/cards.css">
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/admin/perfil.css">
    <link rel="stylesheet" href="../../css/shared/notifications.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

    <main class="dashboard-content">

        <div class="page-header">
            <div>
                <h1><i class="bx bx-user"></i> Mi Perfil</h1>
                <p>Información de tu cuenta de administrador.</p>
            </div>
        </div>

        <div class="main-profile-container" style="margin-top:0;">

            <!-- Loading -->
            <div class="profile-loading" id="profileLoading">
                <i class="bx bx-loader bx-spin"></i>
                <span>Cargando perfil...</span>
            </div>

            <!-- Feedback -->
            <div class="profile-feedback" id="profileFeedback"></div>

            <!-- Contenido (oculto hasta cargar) -->
            <div class="flex-cards-wrapper" id="profileContent" style="display:none;">

                <!-- ── Tarjeta izquierda: Foto + datos básicos ── -->
                <div class="container-perfil">
                    <div class="usuario-image">
                        <i class="bx bx-user-circle"></i>
                    </div>
                    <div class="info-user" id="profileView">
                        <h5>Nombre:</h5>
                        <p id="userNombre">—</p>
                        <h5>Correo:</h5>
                        <p id="userCorreo">—</p>
                        <h5>Rol:</h5>
                        <p id="userRol">—</p>
                    </div>
                </div>

                <!-- ── Tarjeta derecha: Información detallada ── -->
                <div class="container-preferencias">

                    <h2 class="titulo-informacion"><i class="bx bx-detail"></i> Información</h2>

                    <!-- Vista de solo lectura -->
                    <div id="profileView">
                        <h5>Teléfono:</h5>
                        <p id="userTelefono">—</p>
                    </div>

                    <!-- Formulario de edición -->
                    <div class="edit-form" id="editForm">
                        <h4><i class="bx bx-pencil"></i> Editar Perfil</h4>

                        <div class="form-group">
                            <label for="editNombre">Nombre completo *</label>
                            <input type="text" id="editNombre" placeholder="Tu nombre completo">
                        </div>

                        <div class="form-group">
                            <label for="editTelefono">Teléfono</label>
                            <input type="text" id="editTelefono" placeholder="Ej: 4641234567">
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-save" id="btnSaveProfile">
                                <i class="bx bx-check"></i> Guardar cambios
                            </button>
                            <button type="button" class="btn-cancel" id="btnCancelEdit">
                                <i class="bx bx-x"></i> Cancelar
                            </button>
                        </div>
                    </div>

                    <!-- Acciones -->
                    <div class="profile-actions">
                        <button class="btn-edit" id="btnEditProfile">
                            <i class="bx bx-pencil"></i> Editar Perfil
                        </button>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <script src="../../js/helpers/logoutHelper.js"></script>
    <script>
        window.SIDEBAR_CONFIG = {
            role: 'admin',
            userName: 'Administrador',
            userRole: 'Administrador',
            currentPage: 'perfil'
        };
    </script>
    <script src="../../js/sidebar.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/views/perfilView.js"></script>
</body>
</html>
