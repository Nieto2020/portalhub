<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Consultoría Contable</title>
    <link rel="stylesheet" href="../../css/shared/variables.css">
    <link rel="stylesheet" href="../../css/shared/base.css">
    <link rel="stylesheet" href="../../css/auth/auth.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6; margin: 0; font-family: sans-serif; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #2980b9; }
        .message { padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; text-align: center; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Actualizar Contraseña</h2>
        <p style="text-align: center; color: #666; font-size: 0.9em; margin-bottom: 20px;">
            Por seguridad, debes cambiar tu contraseña temporal antes de continuar.
        </p>
        <div id="responseMessage" class="message"></div>
        <form id="changePasswordForm">
            <div class="form-group">
                <label for="new_password">Nueva Contraseña</label>
                <input type="password" id="new_password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar Contraseña</label>
                <input type="password" id="confirm_password" required minlength="8">
            </div>
            <button type="submit">Guardar Contraseña</button>
        </form>
    </div>

    <script>
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const messageDiv = document.getElementById('responseMessage');

            if (new_password !== confirm_password) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Las contraseñas no coinciden';
                return;
            }

            try {
                const response = await fetch('../../../backend/modules/auth/update_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_password, confirm_password })
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = 'Contraseña actualizada. Redirigiendo...';
                    setTimeout(() => {
                        const role = localStorage.getItem('user_role');
                        const roles = { ROL_ADMIN: '../admin/dashboard.html', ROL_ASESOR: '../asesor/dashboard.html', ROL_CLIENTE: '../cliente/dashboard.html' };
                        window.location.href = roles[role] || '../cliente/dashboard.html';
                    }, 2000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = result.message;
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Error al conectar con el servidor';
            }
        });
    </script>
</body>
</html>
